<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль зазора (Экструзия)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
    <h1>Контроль технологического зазора</h1>

    <!-- Левая колонка: Управление -->
    <div class="controls-panel">
        <div class="input-row">
            <label for="matrDiam">Диаметр матрицы (мм):</label>
            <input type="number" id="matrDiam" value="50" step="0.1">
        </div>
        <div class="input-row">
            <label for="dornDiam">Диаметр дорна (мм):</label>
            <input type="number" id="dornDiam" value="30" step="0.1">
        </div>

        <!-- Кнопка ЗАПУСКА КАМЕРЫ (первая, которую нужно нажать) -->
        <button id="startBtn" onclick="startCamera()">▶ ЗАПУСТИТЬ КАМЕРУ</button>

        <div class="status-bar">
            <span class="dot" id="statusDot"></span>
            <span id="valStatus">Ожидание запуска камеры...</span>
        </div>
    </div>

    <!-- Правая колонка: Результаты -->
    <div class="result-panel">
        <h3>Результаты замера</h3>
        
        <div class="metrics-grid">
            <div class="metric-item metric-shift">
                <span class="metric-value" id="valShift">-- мм</span>
                <span class="metric-label">Смещение осей</span>
            </div>
            <div class="metric-item metric-nonuniform">
                <span class="metric-value" id="valNonUniform">-- мм</span>
                <span class="metric-label">Неравномерность зазора</span>
            </div>
            <div class="metric-item metric-gap">
                <span class="metric-value" id="valNominal">-- мм</span>
                <span class="metric-label">Номинальный зазор</span>
            </div>
        </div>

        <!-- КНОПКА ЗАМЕРА (появляется только когда система готова) -->
        <button id="btnFreeze" onclick="freezeMeasurement()" disabled style="margin-top: 20px;">
            🛑 ВЫПОЛНИТЬ ЗАМЕР
        </button>
        
        <button id="resetBtn" onclick="resetSystem()" style="margin-top: 10px;">🔄 Сбросить систему</button>
    </div>

    <!-- Область видео (растягивается на всю ширину контейнера) -->
    <div class="video-area">
        <!-- 1. Живое видео -->
        <video id="video" autoplay muted playsinline></video>
        
        <!-- 2. Буфер для OpenCV (СКРЫТ, только для расчетов) -->
        <canvas id="canvas"></canvas>
        
        <!-- 3. Оверлей для линий (поверх видео) -->
        <canvas id="overlay"></canvas>

        <!-- 4. Замороженный кадр (картинка) -->
        <img id="frozenImg" src="" alt="Result" class="frozen-frame" />
        
        <!-- 5. Оверлей для линий (поверх картинки) -->
        <canvas id="frozenOverlay"></canvas>
    </div>
</div>

<!-- Подключаем OpenCV -->
<script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
<!-- Подключаем наш код -->
<script src="core.js"></script>

</body>
</html>
