<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контроль зазора: Автозамер + Визуализация</title>
  <link rel="stylesheet" href="style.css" />
  <!-- OpenCV через CDN -->
  <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <h1>Контроль зазора</h1>

    <!-- Видео область -->
    <div class="video-area">
      <!-- 1. Скрытый canvas для тяжелых вычислений OpenCV (не виден пользователю) -->
      <canvas id="canvas" style="display:none;"></canvas>
      
      <!-- 2. Само видео (фон) -->
      <video id="video" playsinline muted></video>
   
      <!-- 3. Оверлей для отрисовки в реальном времени (контуры, векторы) -->
      <canvas id="overlay"></canvas>

      <!-- 4. ПЕРЕКРЕСТИЕ (Добавлено сюда!) -->
      <!-- Оно будет поверх видео и канвасов благодаря z-index в CSS -->
      <div class="crosshair-wrapper">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
      </div>

      <!-- 5. Замороженный кадр (после замера) -->
      <img id="frozenImg" class="frozen-frame" />
      
      <!-- 6. Оверлей поверх замороженного кадра (финальные цифры) -->
      <canvas id="frozenOverlay"></canvas>
    </div>

    <!-- Панель управления и результаты -->
    <div class="controls-panel">
      <div class="input-row">
        <label for="dornDiam">Диаметр дорна, мм</label>
        <input type="number" id="dornDiam" value="30" step="0.1" min="1" />
      </div>
      <div class="input-row">
        <label for="matrDiam">Диаметр матрицы, мм</label>
        <input type="number" id="matrDiam" value="50" step="0.1" min="1" />
      </div>

      <button id="startBtn">ЗАПУСТИТЬ КАМЕРУ</button>
      <div class="status-bar">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Ожидание OpenCV...</span>
      </div>
    </div>

    <div class="result-panel">
      <h2>Результаты замера</h2>
      <div class="metrics-grid">
        <!-- Основные метрики -->
        <div class="metric-item metric-gap">
          <span class="metric-value" id="valGap">--</span>
          <span class="metric-label">Средний зазор</span>
        </div>
        <div class="metric-item metric-nonuniform">
          <span class="metric-value" id="valNonUniform">--</span>
          <span class="metric-label">Неравномерность</span>
        </div>

        <div class="metric-item metric-shift">
          <span class="metric-value" id="valShift">--</span>
          <span class="metric-label">Смещение (макс)</span>
        </div>
        <div class="metric-item">
          <span class="metric-value" id="valShiftX">--</span>
          <span class="metric-label">Смещение X</span>
        </div>
        <div class="metric-item">
          <span class="metric-value" id="valShiftY">--</span>
          <span class="metric-label">Смещение Y</span>
        </div>

        <!-- Осевые зазоры -->
        <div class="metric-item metric-left">
          <span class="metric-value" id="valGapLeft">--</span>
          <span class="metric-label">Зазор слева</span>
        </div>
        <div class="metric-item metric-right">
          <span class="metric-value" id="valGapRight">--</span>
          <span class="metric-label">Зазор справа</span>
        </div>
        <div class="metric-item metric-top">
          <span class="metric-value" id="valGapTop">--</span>
          <span class="metric-label">Зазор сверху</span>
        </div>
        <div class="metric-item metric-bottom">
          <span class="metric-value" id="valGapBottom">--</span>
          <span class="metric-label">Зазор снизу</span>
        </div>
      </div>

      <button id="resetBtn">СБРОС</button>
    </div>
  </div>

  <!-- Модули (порядок важен: сначала OpenCV, потом core, потом result, потом init) -->
  <script src="core.js"></script>
  <script src="result.js"></script>
  <script src="init.js"></script>
</body>
</html>
