<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Замер зазора: дорн/матрица</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">
    <h1>📏 Замер зазора: дорн/матрица</h1>

    <!-- Панель управления -->
    <div class="controls-panel">
      <div class="input-row">
        <label>Диаметр дорна (мм)</label>
        <input type="number" id="dornDiam" value="40" step="0.1" />
      </div>
      <div class="input-row">
        <label>Диаметр матрицы (мм)</label>
        <input type="number" id="matrDiam" value="50" step="0.1" />
      </div>

      <div class="input-row">
        <label for="cameraSelect">Камера</label>
        <select id="cameraSelect"></select>
      </div>

      <button id="startBtn">Старт (автозаморозка)</button>
      <button id="resetBtn" class="reset-btn">🔄 Сброс (вернуть видеопоток)</button>

      <div class="status-bar" id="statusBar">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Ожидание загрузки OpenCV...</span>
      </div>
    </div>

    <!-- Результат -->
    <div class="result-panel">
   
      <!-- Область видеопотока: ЕДИНСТВЕННЫЙ контейнер с размерами -->
   <div class="video-area" style="position: relative; width: 100%; max-width: 640px; margin: 0 auto;">
    <video id="video" autoplay muted playsinline style="width: 100%; height: auto; display: block;"></video>
    <canvas id="canvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
    <canvas id="overlay" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
</div>


      <!-- Метрики -->
      <div class="metrics-grid">
        <div class="metric-item metric-gap">
          <span class="metric-value" id="valGap">—</span>
          <span class="metric-label">Зазор</span>
        </div>
        <div class="metric-item metric-nonuniform">
          <span class="metric-value" id="valNonUniform">—</span>
          <span class="metric-label">Неравномерность</span>
        </div>
        <div class="metric-item metric-shift">
          <span class="metric-value" id="valShift">—</span>
          <span class="metric-label">Макс. смещение</span>
        </div>
        <div class="metric-item" style="opacity:0.6">
          <span class="metric-value" id="valX">—</span>
          <span class="metric-label">Смещение X</span>
        </div>
        <div class="metric-item" style="opacity:0.6">
          <span class="metric-value" id="valY">—</span>
          <span class="metric-label">Смещение Y</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ВАЖНО: OpenCV должен быть первым! -->
  <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
  
  <!-- Инициализация камеры и размеров -->
  <script src="init.js"></script>
  
  <!-- Логика обработки (ядро) -->
  <script src="core.js"></script>
</body>
</html>
