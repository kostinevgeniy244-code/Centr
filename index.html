<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCV: Дорн/Матрица замер</title>
    <!-- Подключаем OpenCV.js через CDN -->
    <script src="https://docs.opencv.org/4.5.0/opencv.js" async></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        
<!-- Панель логов загрузки -->
<div class="load-log">
  <strong>Статус загрузки:</strong>
  <ul id="load-messages" class="log-list">
    <!-- Сюда JS будет добавлять строки -->
  </ul>
</div>


<h1>Замер: Дорн / Матрица</h1>
      </header>

      <!-- Экран ввода параметров -->
      <section id="input-screen" class="screen active">
        <div class="form-group">
          <label for="matrix-diameter">Диаметр матрицы, мм</label>
          <input type="number" id="matrix-diameter" value="50" step="0.1" />
        </div>
        <div class="form-group">
          <label for="dorn-diameter">Диаметр дорна, мм</label>
          <input type="number" id="dorn-diameter" value="30" step="0.1" />
        </div>
        <div class="form-group">
          <label for="tolerance-offset">Допуск смещения, мм (по умолчанию 0.01)</label>
          <input type="number" id="tolerance-offset" value="0.01" step="0.001" />
        </div>
        <div class="form-group">
          <label for="tolerance-uneven">Допуск неравномерности, мм (по умолчанию 0.01)</label>
          <input type="number" id="tolerance-uneven" value="0.01" step="0.001" />
        </div>
        <button id="start-btn" type="button">Начать замер</button>
      </section>

      <!-- Экран камеры и обработки -->
      <section id="camera-screen" class="screen hidden">
        <div class="status-bar">
          <span id="status-text">РЕЖИМ: ПОИСК</span>
          <span id="status-dot" class="dot dot-search"></span>
        </div>

        <div class="video-container">
          <video id="video" autoplay playsinline muted></video>
          <!-- Оверлей для отрисовки контуров и линий в реальном времени -->
          <canvas id="overlay" class="overlay"></canvas>
        </div>

        <!-- Замороженный кадр (показывается только после фиксации) -->
        <canvas id="frozen-canvas" class="hidden"></canvas>

        <div class="controls">
          <button id="freeze-btn" type="button" disabled>Зафиксировать результат</button>
          <button id="reset-btn" type="button">Сброс</button>
        </div>

        <div id="result-panel" class="result-panel hidden">
          <h3>Результаты замера</h3>
          <ul>
            <li><strong>Диаметр матрицы:</strong> <span id="res-matrix-diam">—</span> мм</li>
            <li><strong>Диаметр дорна:</strong> <span id="res-dorn-diam">—</span> мм</li>
            <li><strong>Смещение центров:</strong> <span id="res-offset">—</span> мм</li>
            <li><strong>Неравномерность зазора:</strong> <span id="res-uneven">—</span> мм</li>
            <li><strong>Вердикт:</strong> <span id="res-verdict" class="verdict"></span></li>
          </ul>
        </div>
      </section>
    </div>

    <!-- Модульные скрипты -->
    <script type="module" src="config.js"></script>
    <script type="module" src="camera.js"></script>
    <script type="module" src="cv-processing.js"></script>
    <script type="module" src="ui.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
<!-- Конец файла -->
