<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCV: Дорн/Матрица замер</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Замер дорна и матрицы</h1>
      </header>

      <div class="controls">
        <button id="startBtn">Запустить камеру</button>
        <button id="freezeBtn" disabled>Заморозить кадр</button>
        <button id="unfreezeBtn" disabled style="display: none;">Продолжить</button>
      </div>

      <div class="view">
        <video id="videoEl" playsinline autoplay muted></video>
        <canvas id="overlayEl"></canvas>
        
        <div id="frozenContainer" class="frozen-container" style="display: none;">
          <img id="frozenImgEl" class="frozen-img" />
          <canvas id="frozenOverlayEl" class="frozen-overlay"></canvas>
        </div>
      </div>

      <div id="resultInfo" class="result-info"></div>
    </div>

    <script src="core.js" defer></script>
    <script src="result.js" defer></script>
  </body>
</html>
