<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест камеры (мобильный)</title>
    <style>
      body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; }
      #video { width: 100%; max-width: 400px; border: 2px solid red; }
      button { padding: 15px 30px; font-size: 18px; margin-top: 20px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>Тест камеры</h2>
    <video id="video" autoplay muted playsinline></video>
    <button id="btn">Разрешить камеру</button>

    <script>
      const btn = document.getElementById('btn');
      const video = document.getElementById('video');

      btn.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          btn.style.display = 'none';
        } catch (err) {
          alert('Ошибка: ' + err.message);
          console.error(err);
        }
      };
    </script>
  </body>
</html>
